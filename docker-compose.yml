services:
  flask:
    build: .
    container_name: flask
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    volumes:
      - .:/app.py

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - .:/hamburgueria.sql

volumes:
  mysql_data: